name: Release

on:
  workflow_dispatch:
#  push:
#    tags:
#    - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: 20.x
    - name: Install dependencies
      run: npm ci
    - name: Fetch
      run: npm run fetch

    - name: Compile
      run: npm run webpack:prod

    - name: Package Windows
      if: runner.os == 'Windows'
      run: |
        node release-automation/build.js --windows --microsoft-store --x64 --ia32 --arm64 --production
        node release-automation/build.js --windows-portable --x64 --production
        node release-automation/build.js --windows-legacy --ia32 --x64 --production
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Package Linux
      if: runner.os == 'Linux'
      run: |
        node release-automation/build.js --debian --tarball --appimage --x64 --armv7l --arm64 --production
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs: [build]
    steps:
    - name: Release
      uses: actions/create-release@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5
      with:
        tag: ${{ github.ref_name }}
        name: Build ${{ github.ref_name }}
        body: Build ${{ github.ref_name }}"
        draft: false
        prerelease: true
        artifacts: dist/
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
