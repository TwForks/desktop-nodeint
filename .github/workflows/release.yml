name: Release

on:
  workflow_dispatch:
#  push:
#    tags:
#    - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: 20.x
        cache: 'npm'

  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    needs: [ci]
    steps:
    - name: Install dependencies
      run: npm ci
    
    - name: Fetch
      run: npm run fetch
    
    - name: Compile
      run: npm run webpack:prod

    - name: Package Windows
      if: runner.os == 'Windows'
      run: |
        node release-automation/build.js --windows-portable --x64 --production
        node release-automation/build.js --windows-legacy --ia32 --x64 --production
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Package Linux
      if: runner.os == 'Linux'
      run: |
        node release-automation/build.js --debian --tarball --appimage --x64 --armv7l --arm64 --production
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}
        retention-days: 1
        path: dist/

  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs: [build]
    steps:
    - name: Setup artifact uploads
      run: |
        mkdir art/
  
    - name: Download artifacts
      uses: actions/download-artifact@v4.1.9
      with:
        path: art/

    - name: Upload release (ubuntu-latest)
      uses: svenstaro/upload-release-action@2.2.1
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: art/ubuntu-latest
        asset_name: debian.zip
        tag: latest
        overwrite: true
        prerelease: true
        body: "Build"

    - name: Upload release (windows-latest)
      uses: svenstaro/upload-release-action@2.2.1
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: art/windows-latest
        asset_name: windows.zip
        tag: latest
        overwrite: true
        prerelease: true
        body: "Build"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
